# Not in kustomization.yaml, so that no real values go near the repository.
# Copy it elsewhere, fill it in, and apply it, or see README.md for the
# equivalent kubectl command.
apiVersion: v1
kind: Secret
metadata:
  name: dc-server
  namespace: digitalcurling
type: Opaque
stringData:
  # Hashes every password, so changing it invalidates all of them. DC_USERS
  # sets them again on the next start.
  pepper: CHANGE_ME
  # A JSON object of username to password, as clients log in.
  users: '{"CHANGE_ME": "CHANGE_ME"}'
