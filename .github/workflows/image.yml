name: Image

on:
  push:
    branches:
      - local_build
      - k8s-postgres
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/digitalcurling4-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/digitalcurling4-server:latest
