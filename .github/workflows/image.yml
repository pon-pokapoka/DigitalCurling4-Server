name: Image

# Checks that the image builds. Nothing is published: the cluster runs an image
# built and imported into the node by k8s/image.sh.
on:
  push:
    branches:
      - local_build
      - k8s-postgres
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
